<div class="share-bar" role="group" aria-label="分享">
  <a href="https://service.weibo.com/share/share.php?url={{ page.url | absolute_url | url_encode }}&title={{ page.title | url_encode }}" target="_blank" rel="noopener noreferrer">微博</a>
  <a href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}" target="_blank" rel="noopener noreferrer">X</a>
  <button type="button" id="share-copy-link" data-url="{{ page.url | absolute_url }}">复制链接</button>
</div>
<script>
(function () {
  var btn = document.getElementById('share-copy-link');
  if (!btn || !navigator.clipboard) return;
  btn.addEventListener('click', function () {
    navigator.clipboard.writeText(btn.getAttribute('data-url')).then(function () {
      var old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = old; }, 1500);
    });
  });
})();
</script>
