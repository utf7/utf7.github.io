---
layout: default
---
<section class="collection-head small geopattern" data-pattern-id="{{ page.title | truncate: 15, ''}}">
<div class="container">
  <div class="columns">
    <div class="column three-fourths">
      <div class="collection-title">
        <h1 class="collection-header">{{ page.title }}</h1>
      </div>
    </div>
  </div>
</div>
</section>
<!-- / .banner -->
<section class="container content">
<div class="columns">
  <div class="column three-fourths" >
    <article class="article-content markdown-body" data-pagefind-body>
    <span data-pagefind-meta="title" hidden>{{ page.title }}</span>
    {{ content }}
    </article>
    <div class="share" data-pagefind-ignore>
      {% include sns-share.html %}
    </div>
    <div class="comment" data-pagefind-ignore>
      {% include comments.html %}
    </div>
  </div>
  <div class="column one-fourth" data-pagefind-ignore>
    {% include sidebar-search.html %}
    {% include sidebar-post-nav.html %}
  </div>
</div>
</section>
<!-- /section.content -->
