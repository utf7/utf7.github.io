# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl:
url: https://utf7.github.io
date_format: "ordinal"
title: utf7
subtitle: "做好人,做好事"
description: "utf7 的个人博客/欢迎关注公众号yechaotalk"
keywords: utf7, seven,HBase
favicon: /favicon.ico
timezone: Asia/Shanghai
encoding: "utf-8"
source_code: https://github.com/utf7/utf7.github.io
side_bar_repo_limit: 5
repository: utf7/utf7.github.io

# ---------------- #
#      Author      #
# ---------------- #
author: utf7/Yechao Chen
organization: utf7, Inc.
organization_url: https://utf7.github.io
location: Shanghai, China
email: chenyechao@gmail.com

# ---------------- #
#    Navigation    #
# ---------------- #
navs:
  -
    href: /
    label: 首页

  -
    href: /categories/
    label: 分类

  -
    href: /wiki/
    label: 维基

  -
    href: /links/
    label: 链接

  -
    href: /about/
    label: 关于

# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
highlighter: rouge
paginate: 8
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
plugins:
    - rouge
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jemoji
collections:
    wiki:
        output: true
        permalink: /wiki/:path/

github: [metadata]

# Large PDFs / local-only files — keep in git if needed, but skip Pages build
exclude:
  - docs/presto
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - blog_template
  - README.md
  - LICENSE

# ---------------- #
#      Socials     #
# ---------------- #
github_username: utf7
weibo_username: chenyechao

# ---------------- #
#      Comments    #
# ---------------- #
# support provider: utterances, giscus, disqus
# utterances: install https://github.com/apps/utterances on the comments repo
comments_provider: utterances

utterances:
    repo: utf7/blog-comments
    issue_term: pathname
    theme: github-light

# giscus:
#     repo: utf7/blog-comments
#     repo_id: REPLACE_ME
#     category: Announcements
#     category_id: REPLACE_ME
#     mapping: pathname
#     theme: light

# ---------------- #
#    Analytics     #
# ---------------- #
# Set to a GA4 Measurement ID (G-XXXXXXXX) to enable; leave empty to disable
google:
    analytics_id:

# ---------------- #
#      Datas       #
# ---------------- #
skill_programing_keywords: [Java, Design Patterns]
skill_big_data_keywords: [HBase,Hadoop,Hive,Spark,Presto,MySQL]
