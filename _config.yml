# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
highlighter: rouge
paginate: 8
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
plugins:
    - rouge
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jemoji
collections:
    wiki:
        output: true
        permalink: /wiki/:path/

github: [metadata]

# Local-only files — skip Pages build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - blog_template
  - README.md
  - LICENSE
  - scripts
  - pagefind.yml
  - node_modules
  - docs/todolist.md
  - docs/*.patch
  - _posts/template.md
  - _wiki/template.md
  - _drafts
  - images/posts/bigdata-fucked-up


